name: Update national radar and WFO catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-radar-catalog.yml'
      - 'scripts/update_noaa_radars.py'
      - 'scripts/build_national_catalogs.py'
      - 'scripts/validate_catalog.py'
      - 'catalogs/radar_overrides.json'
      - 'catalogs/climavision_radars.json'
      - 'catalogs/wfo_overrides.json'
      - 'catalogs/backup_assignments_seed.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install catalog builder dependencies
        run: pip install -r requirements.txt

      - name: Refresh NOAA NEXRAD and TDWR catalog
        run: python scripts/update_noaa_radars.py

      - name: Build national WFO radar and backup catalogs
        run: python scripts/build_national_catalogs.py

      - name: Validate catalogs
        run: python scripts/validate_catalog.py

      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "radar-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogs/radar_catalog.json catalogs/wfo_catalog.json catalogs/backup_assignments.json
          git commit -m "Update national radar and WFO catalogs"
          git push
