name: Update NOAA radar catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh NOAA NEXRAD and TDWR catalog
        run: python scripts/update_noaa_radars.py
      - name: Validate catalogs
        run: python scripts/validate_catalog.py
      - name: Commit changes if needed
        run: |
          if git diff --quiet; then
            echo "No radar catalog changes."
            exit 0
          fi
          git config user.name "radar-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalogs/radar_catalog.json
          git commit -m "Update NOAA radar catalog"
          git push
